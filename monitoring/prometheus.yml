
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "clouddeploy-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:5000"]
        labels:
          application: "clouddeploy"
          environment: "development"

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
